<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <header>
      <h1 id="title">Community Feedback Survey</h1>
      <p id="description">We would love to hear your thoughts on how we can improve our platform!</p>
    </header>
    <main>    
        <form id="survey-form">
                <label id="name-label" for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
                <br>
                <br>
                <label id="email-label" for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email address" required>
                <br>
                <br>
                <label id="number-label" for="number">Age (Optional)</label>
                <input type="number" id="number" min="1" max="100" placeholder="Enter your age">
                <br>
                <br>
                <label for="dropdown">Which role best describes you?</label>
                <br>
                <br>
                <select id="dropdown">
                    <option value="" disabled selected>Select your current role</option>
                    <option value="student">Student</option>
                    <option value="developer">Full-Time Developer</option>
                    <option value="hobbyist">Hobbyist</option>
                    <option value="other">Other</option>
                </select>
                <br>
                <br>
                <p>Would you recommend our platform to a friend?</p>
                <label class="radio-checkbox-label">
                    <input type="radio" name="recommend" value="definitely" checked> Definitely
                </label>
                <label class="radio-checkbox-label">
                    <input type="radio" name="recommend" value="maybe"> Maybe
                </label>
                <label class="radio-checkbox-label">
                    <input type="radio" name="recommend" value="not-sure"> Not Sure
                </label>
                <p>What is your favorite feature of freeCodeCamp?</p>
                  <select id="dropdown_like">
                    <option value="" disabled selected>Select your current role</option>
                    <option value="Challenges">Interactive Coding Challenges</option>
                    <option value="Projects">Real-world Certification Projects</option>
                    <option value="community">Helpful Forum & Community</option>
                    <option value="Everything">Everything!</option>
                  </select>
                  <br>
                  <br>
                  <p>What features would you like to see improved?</p>
                  <label class="radio-checkbox-label">
                    <input type="checkbox" name="preferences" value="front-end"> Front-end Projects
                    <input type="checkbox" name="preferences" value="back-end"> Back-end Project
                    <input type="checkbox" name="preferences" value="videos"> Video Tutorials
                    <input type="checkbox" name="preferences" value="community"> Forum & Community
                  </label>
                  <br>
                  <br>
                  <label for = "suggestions">Any comments or suggestions?</label>
                  <br>
                  <textarea id = "suggestions" name = "suggestions" rows = "5" cols = "30" minlength = "10"></textarea>
                  <button id="submit">Submit</button>
    </main>

  </body>
</html>
